[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuclear-segmentation-app"
version = "0.6.0"
description = "Desktop Napari workflow for 3D nuclear segmentation, perinuclear markers and calibrated density"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.5.3", "scipy>=1.18.1", "pandas>=3.0.6",
  "scikit-image>=0.26.0", "tifffile>=2026.9.15",
  "matplotlib>=3.11.2", "numba>=0.61", "napari>=0.9.1", "magicgui>=0.10.2", "qtpy>=2.4.3"
]

[project.optional-dependencies]
gui = ["PyQt6>=6.11.0"]
segmentation = ["cellpose>=4,<5", "torch>=2.2"]
zarr = ["zarr>=2.16,<3", "numcodecs>=0.12,<0.16"]
test = ["pytest>=8"]

[project.scripts]
nuclear-segmentation = "nuclear_segmentation.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nuclear_segmentation = ["defaults.json", "stages/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
